name: INFRA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/pulumi-preview.yml'

permissions:
  pull-requests: write
  contents: read
  id-token: write          # mint the OIDC token for Workload Identity Federation

env:
  # Resolve baski from its git URL (as prod/Docker does), ignoring the local editable path
  # source — the runner has no sibling ../baski checkout. Matches test-app.yml.
  UV_NO_SOURCES: "1"
  # Project/region/state-bucket are baked into the Makefile (single project) — only the
  # passphrase is a secret. GCP auth is keyless via WIF (no SA key), see the auth step.
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

jobs:
  infra_preview:
    name: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cloud SDK auth (Workload Identity Federation — keyless)
        uses: google-github-actions/auth@v2
        with:
          project_id: nisse2050
          workload_identity_provider: projects/675179615608/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-actions@nisse2050.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: make setup
      - name: Pulumi preview
        run: make infra-setup infra-diff   # CI is fresh, so bootstrap the backend explicitly
      - name: Comment PR with preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const preview = fs.readFileSync('infrastructure/preview.txt', 'utf8');
            const body = preview.length > 65000
              ? preview.slice(0, 65000) + '\n\n... (truncated)'
              : preview;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Pulumi Preview\n```\n' + body + '\n```',
            });
