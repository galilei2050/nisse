options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Everything heavy is baked into builder:latest (docker, gcloud + docker-auth, pulumi,
  # uv + warmed dep cache — see infrastructure/docker/Dockerfile.builder). So this step
  # installs nothing: `uv sync` only rematerializes .venv from the baked cache (Cloud Build
  # wipes /workspace, so the venv can't be baked) with no downloads, then `make cd` runs
  # infra-setup → build+push image → pulumi up. --no-dev drops mypy/ruff/pytest/pre-commit;
  # pulumi + pulumi-gcp are prod deps (via baski) and stay.
  - name: 'us-docker.pkg.dev/$PROJECT_ID/docker/builder:latest'
    id: 'cd'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        uv sync --frozen --no-dev
        make cd
    secretEnv: ['PULUMI_CONFIG_PASSPHRASE']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/PULUMI_CONFIG_PASSPHRASE/versions/latest
      env: 'PULUMI_CONFIG_PASSPHRASE'
