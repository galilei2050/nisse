options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

steps:
  # One step, one container that has BOTH docker and gcloud (cloud-sdk full image).
  # The old two-step split was broken: the uv image can't run `docker build`, and the
  # docker image can't run pulumi — but `make cd` needs both in the same container.
  # Here we install make/uv/pulumi on top of cloud-sdk, then `make cd` does everything
  # (infra-setup → build+push image → pulumi up). Single source of truth: nothing here
  # the Makefile can't do locally.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    id: 'cd'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update && apt-get install -y --no-install-recommends make git curl
        curl -LsSf https://astral.sh/uv/install.sh | sh
        # `make setup` installs the Pulumi CLI + uv deps; we just need its bin dir on PATH
        # with $HOME expanded (the Makefile's literal ~/.pulumi/bin isn't shell-expanded).
        export PATH="$$HOME/.local/bin:$$HOME/.pulumi/bin:$$PATH"
        gcloud auth configure-docker us-docker.pkg.dev --quiet
        make setup
        make cd
    secretEnv: ['PULUMI_CONFIG_PASSPHRASE']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/PULUMI_CONFIG_PASSPHRASE/versions/latest
      env: 'PULUMI_CONFIG_PASSPHRASE'
