options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # The CD toolchain (docker, gcloud, pulumi, uv, make) is baked into builder:latest
  # (infrastructure/docker/Dockerfile.builder, pushed via `make builder-image-push`),
  # so this step just runs the same `make setup && make cd` you'd run locally — no flaky
  # runtime apt-get/curl. `setup` preps project deps (uv sync, pulumi plugins); `cd` does
  # infra-setup → build+push image → pulumi up.
  - name: 'us-docker.pkg.dev/$PROJECT_ID/docker/builder:latest'
    id: 'cd'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        make setup
        make cd
    secretEnv: ['PULUMI_CONFIG_PASSPHRASE']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/PULUMI_CONFIG_PASSPHRASE/versions/latest
      env: 'PULUMI_CONFIG_PASSPHRASE'
