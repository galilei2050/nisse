[project]
name = "nisse"
version = "0.1.0"
description = "Personal AI assistant Telegram bot. Deploys to Cloud Run on GCP project nisse2050."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Vladimir Baskakov" }]

dependencies = [
    "baski @ git+https://github.com/galilei2050/baski.git@main",
    "anthropic",
    "pymongo>=4.9",
    "telegramify-markdown>=1.1.5",
    "browserbase>=1.13.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
]

[tool.uv.sources]
baski = { path = "../baski", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
external = ["ANON001", "ANON002"]  # anon_lint.py custom rules
ignore = [
    # Formatter conflicts
    "COM812",
    # Project conventions (shared with baski)
    "RUF013",  # implicit-optional — explicit X | None used instead
    "RUF001",  # ambiguous unicode chars — bilingual (RU + EN) text needs real Cyrillic
    "SIM110",  # explicit for-loops over any() — easier to extend with logging later
    "D203", "D213",  # docstring style conflicts (we use D211, D212)
    "G",    # logging-format
    "TRY003",
    "EM101", "EM102",
    "TID252",
    "B008",  # FastAPI
]

[tool.ruff.lint.pylint]
max-args = 4
max-positional-args = 4
max-branches = 7
max-statements = 30
max-locals = 10
max-bool-expr = 3
max-nested-blocks = 3
max-returns = 5

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Pulumi infra: modules are imported flat via side-effect imports in __main__.py,
# so the implicit-namespace warning (INP001) is by design; `secret_id` is a GCP
# resource name, not a credential (S106); re-export package inits need no docstring.
"infrastructure/**" = ["INP001", "S106", "D104"]
# probe.py, trace.py, startbrowser.py are manual CLI harnesses whose stdout IS their output (T201).
# trace_view.print_trace exposes the view flags as keyword args — a CLI display knob set, not a god-fn (PLR0913).
"app/probe.py" = ["T201"]
"app/trace.py" = ["T201"]
"app/trace_view.py" = ["T201", "PLR0913"]
"app/startbrowser.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
