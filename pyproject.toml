[project]
name = "nisse"
version = "0.1.0"
description = "Personal AI assistant Telegram bot. Deploys to Cloud Run on GCP project nisse2050."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Vladimir Baskakov" }]

dependencies = [
    "baski @ git+https://github.com/galilei2050/baski.git@main",
    "anthropic",
    "elevenlabs",
    "pymongo>=4.9",
    "telegramify-markdown>=1.1.5",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
baski = { path = "../baski", editable = true }

# ANON003 (baski_lint) flags a free function that takes a long-lived collaborator as a parameter —
# it is a method missing its class. baski ships the rule and the third-party client names; the
# collaborators below are this app's own, so they can only be declared here.
[tool.anon_lint]
extend_dependency_types = [
    "Agent",
    "Assistant",
    "MongoMessageHistory",
    "PendingQuestions",
    "SchedulingService",
    "ShortTermMemory",
    "Speaker",
    "Transcriber",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# Force every logger.info(extra=…) to actually build its LogRecord. At the default WARNING the call
# returns before that, so a field colliding with a reserved LogRecord attribute (`created`,
# `taskName`, `module`…) raises in production on a line the suite ran happily past.
log_level = "INFO"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
external = ["ANON001", "ANON002", "ANON003"]  # baski_lint custom rules
ignore = [
    # Formatter conflicts
    "COM812",
    # Project conventions (shared with baski)
    "RUF013",  # implicit-optional — explicit X | None used instead
    "RUF001",  # ambiguous unicode chars — bilingual (RU + EN) text needs real Cyrillic
    "SIM110",  # explicit for-loops over any() — easier to extend with logging later
    "D203", "D213",  # docstring style conflicts (we use D211, D212)
    "G",    # logging-format
    "TRY003",
    "EM101", "EM102",
    "TID252",
    "B008",  # FastAPI
]

[tool.ruff.lint.pylint]
max-args = 4
max-positional-args = 4
max-branches = 7
max-statements = 30
max-locals = 10
max-bool-expr = 3
max-nested-blocks = 3
max-returns = 5

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Pulumi infra: modules are imported flat via side-effect imports in __main__.py,
# so the implicit-namespace warning (INP001) is by design; `secret_id` is a GCP
# resource name, not a credential (S106); re-export package inits need no docstring.
"infrastructure/**" = ["INP001", "S106", "D104"]
# probe.py is a manual CLI harness whose stdout IS its output — print is intended (T201).
"app/probe.py" = ["T201"]
"app/curate_probe.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
